<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D141B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimoine">
<title>Mon patrimoine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<style>
:root {
  --bg: #E9EDF0;
  --surface: #FFFFFF;
  --surface-2: #F3F6F8;
  --ink: #15202B;
  --ink-2: #4E5C69;
  --ink-3: #7A8793;
  --line: #D3DAE0;
  --accent: #22395A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE5F0;
  --focus: #3F6FA8;
  /* Poches : couleurs des billets en euros */
  --c-garanti: #3F6FA8;   /* 20 € */
  --c-actions: #5B8A4B;   /* 100 € */
  --c-av: #B48C24;        /* 200 € */
  --c-crypto: #7A5C9E;    /* 500 € */
  --c-provisions: #8A9097;/* 5 € */
  --c-attente: #C98446;   /* 50 € */
  --c-courant: #B9C2CA;
  --rouge: #B5473F;       /* 10 € */
  --orange: #B7702A;
  --vert: #3E7D52;
  --rouge-soft: #F6E3E1;
  --orange-soft: #F5EADC;
  --vert-soft: #E0EFE5;
  --info-soft: #E3EAF3;
  --shadow-bar: 0 -1px 0 var(--line);
  --serif: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D141B; --surface: #151F29; --surface-2: #1B2733; --ink: #E7ECF1; --ink-2: #A3B0BC; --ink-3: #7C8995;
    --line: #283543; --accent: #A9C1E6; --accent-ink: #0D141B; --accent-soft: #22324A; --focus: #A9C1E6;
    --c-garanti: #7FA6D9; --c-actions: #8DBA7C; --c-av: #D8B457; --c-crypto: #A98BCD; --c-provisions: #A5ACB3; --c-attente: #E2A36B; --c-courant: #56626E;
    --rouge: #E3877E; --orange: #E0A060; --vert: #7FC393;
    --rouge-soft: #3A2224; --orange-soft: #3A2E1F; --vert-soft: #1C3326; --info-soft: #1D2B3C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D141B; --surface: #151F29; --surface-2: #1B2733; --ink: #E7ECF1; --ink-2: #A3B0BC; --ink-3: #7C8995;
  --line: #283543; --accent: #A9C1E6; --accent-ink: #0D141B; --accent-soft: #22324A; --focus: #A9C1E6;
  --c-garanti: #7FA6D9; --c-actions: #8DBA7C; --c-av: #D8B457; --c-crypto: #A98BCD; --c-provisions: #A5ACB3; --c-attente: #E2A36B; --c-courant: #56626E;
  --rouge: #E3877E; --orange: #E0A060; --vert: #7FC393;
  --rouge-soft: #3A2224; --orange-soft: #3A2E1F; --vert-soft: #1C3326; --info-soft: #1D2B3C;
  color-scheme: dark;
}

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
.num, .amount { font-variant-numeric: tabular-nums lining-nums; }

.screen { max-width: 560px; margin: 0 auto; padding: 18px 18px calc(96px + env(safe-area-inset-bottom, 0px)); }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 0 18px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.05; letter-spacing: -0.01em; margin: 0; }
h2 { font-size: 17px; font-weight: 650; margin: 28px 0 10px; letter-spacing: -0.005em; }
h3 { font-size: 15.5px; font-weight: 650; margin: 0 0 4px; }
p { margin: 0 0 10px; }
.muted { color: var(--ink-2); }
.small { font-size: 13.5px; }
.tiny { font-size: 12.5px; color: var(--ink-3); }
a { color: var(--accent); }

.badge { font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--vert); display: inline-block; }
.badge.local i { background: var(--orange); }

/* ---- Hero ---- */
.hero { margin: 4px 0 6px; }
.hero .when { font-size: 14px; color: var(--ink-2); margin: 0 0 2px; }
.hero .amount { font-family: var(--serif); font-weight: 500; font-size: 48px; line-height: 1.05; letter-spacing: -0.02em; margin: 0; }
.hero .amount small { font-size: 0.5em; color: var(--ink-2); margin-left: 2px; }
.hero .delta { font-size: 14.5px; margin: 6px 0 0; }
.up { color: var(--vert); } .down { color: var(--rouge); }

/* ---- Frise de vie ---- */
.frise { margin: 22px 0 4px; }
.frise svg { width: 100%; height: auto; display: block; overflow: visible; }
.frise .now-txt { font-size: 14.5px; margin: 8px 0 0; }
.frise .now-txt b { font-weight: 650; }

/* ---- Répartition ---- */
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); margin: 4px 0 12px; }
.stack span { display: block; height: 100%; }
.legend { list-style: none; padding: 0; margin: 0; }
.legend li { display: grid; grid-template-columns: 12px 1fr auto 52px; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.legend li:last-child { border-bottom: 0; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend .v { text-align: right; font-variant-numeric: tabular-nums; }
.legend .p { text-align: right; color: var(--ink-2); font-size: 13.5px; font-variant-numeric: tabular-nums; }

/* ---- Blocs ---- */
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; }
.group + .group { margin-top: 12px; }
.group.pad { padding: 14px 16px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 48px; }
.row:last-child { border-bottom: 0; }
.row .l { flex: 1; min-width: 0; }
.row .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.tap { cursor: pointer; }
.row.tap::after { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink-3); border-top: 2px solid var(--ink-3); transform: rotate(45deg); margin-left: 4px; flex: none; }
.row.total { font-weight: 650; }

/* ---- Alertes ---- */
.alerts { display: grid; gap: 8px; }
.alert { border-radius: 12px; padding: 12px 14px 12px 16px; position: relative; background: var(--info-soft); }
.alert::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.alert.rouge { background: var(--rouge-soft); } .alert.rouge::before { background: var(--rouge); }
.alert.orange { background: var(--orange-soft); } .alert.orange::before { background: var(--orange); }
.alert.vert { background: var(--vert-soft); } .alert.vert::before { background: var(--vert); }
.alert h3 { font-size: 15px; margin: 0 0 3px; }
.alert p { font-size: 14px; color: var(--ink-2); margin: 0; }
.alert button.link { margin-top: 6px; }
.calm { font-size: 14.5px; color: var(--ink-2); padding: 12px 0; }

/* ---- Progression ---- */
.goal { padding: 12px 0; border-bottom: 1px solid var(--line); }
.goal:last-child { border-bottom: 0; }
.goal .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.goal .top .r { font-variant-numeric: tabular-nums; white-space: nowrap; }
.prog { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 8px 0 6px; }
.prog span { display: block; height: 100%; background: var(--c-garanti); border-radius: 3px; }
.chip { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: var(--vert-soft); color: var(--vert); white-space: nowrap; }
.chip.non { background: var(--rouge-soft); color: var(--rouge); }
.chip.entame { background: var(--orange-soft); color: var(--orange); }

/* ---- Contrôles ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; cursor: pointer; width: 100%; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--rouge); border: 1px solid var(--line); }
.btn:disabled { opacity: 0.5; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.btns.two { grid-template-columns: 1fr 1fr; }
button.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 14.5px; cursor: pointer; }
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; margin: -4px 0 4px; cursor: pointer; font-size: 15.5px; }
.back::before { content: ""; width: 8px; height: 8px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin: 0 0 16px; }
.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 38px; font-weight: 600; font-size: 14.5px; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

.stepper { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 14px; }
.stepper .cur { text-align: center; flex: 1; }
.stepper .cur b { display: block; font-family: var(--serif); font-weight: 500; font-size: 24px; line-height: 1.1; }
.stepper .cur span { font-size: 13.5px; color: var(--ink-2); }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.stepper button::before { content: ""; width: 9px; height: 9px; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg); margin-left: 4px; }
.stepper button.next::before { transform: rotate(-135deg); margin-left: -4px; }
.stepper button:disabled { opacity: 0.35; }

/* ---- Formulaires ---- */
.fields { display: grid; }
.field { display: grid; grid-template-columns: 1fr 128px; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: 0; }
.field label { font-size: 15px; }
.field .hint { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-3); margin-top: -2px; }
.field.wide { grid-template-columns: 1fr; }
.field.wide .hint { grid-column: 1; }
input.in, select.in, textarea.in {
  width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: #FFF9DB; color: var(--ink); padding: 0 12px; font-size: 16px;
  font-variant-numeric: tabular-nums; text-align: right; -webkit-appearance: none; appearance: none;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) input.in, :root:not([data-theme="light"]) select.in, :root:not([data-theme="light"]) textarea.in { background: #2B2A1C; } }
:root[data-theme="dark"] input.in, :root[data-theme="dark"] select.in, :root[data-theme="dark"] textarea.in { background: #2B2A1C; }
input.in.txt, select.in, textarea.in { text-align: left; }
textarea.in { padding: 10px 12px; min-height: 72px; resize: vertical; }
input.in.prefilled { color: var(--ink-2); }
.unit { position: relative; }
.unit::after { content: attr(data-u); position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 15px; pointer-events: none; }
.unit input.in { padding-right: 30px; }
.check { display: flex; align-items: center; gap: 12px; }
.check input { width: 24px; height: 24px; accent-color: var(--accent); flex: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 0; }
.summary div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.summary b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; font-weight: 650; }
.summary span { font-size: 12.5px; color: var(--ink-2); }

/* ---- Barres budget vs réel ---- */
.cmp { padding: 10px 0; border-bottom: 1px solid var(--line); }
.cmp:last-child { border-bottom: 0; }
.cmp .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.cmp .top .r { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cmp .track { height: 6px; background: var(--surface-2); border-radius: 3px; margin-top: 6px; position: relative; overflow: hidden; }
.cmp .track span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--c-garanti); }
.cmp .track span.over { background: var(--rouge); }

/* ---- Graphique et tableaux ---- */
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .bar { cursor: pointer; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 460px; }
.tbl th, .tbl td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
.tbl thead th { font-weight: 600; color: var(--ink-2); font-size: 12.5px; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.sel td { background: var(--accent-soft); }

/* ---- Calendrier ---- */
.year { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 26px 0 6px; }
.jalon { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: start; }
.jalon:last-child { border-bottom: 0; }
.jalon input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); }
.jalon .t { font-size: 15px; font-weight: 550; }
.jalon.done .t { color: var(--ink-3); text-decoration: line-through; }
.jalon .d { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.jalon .m { font-size: 12.5px; color: var(--ink-3); }
.jalon .m.late { color: var(--rouge); font-weight: 600; }
.jalon .del { background: none; border: 0; color: var(--ink-3); font-size: 12.5px; padding: 4px 0 0; cursor: pointer; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin: 6px 0; font-size: 15px; }

/* ---- Barre d'onglets ---- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  box-shadow: var(--shadow-bar);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tabbar button { border: 0; background: none; padding: 8px 2px 7px; display: grid; justify-items: center; gap: 3px; color: var(--ink-3); font-size: 10.5px; letter-spacing: -0.01em; font-weight: 600; cursor: pointer; min-height: 54px; white-space: nowrap; }
.tabbar button[aria-current="page"] { color: var(--accent); }
.tabbar svg { width: 24px; height: 24px; }
.tabbar.hide { display: none; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14.5px; z-index: 30; max-width: calc(100% - 36px); box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.toast[hidden] { display: none; }

.loading { min-height: 70vh; display: grid; place-items: center; text-align: center; color: var(--ink-2); }
.pulse { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } * { scroll-behavior: auto !important; } }
.sep { height: 1px; background: var(--line); margin: 18px 0; }
.note { font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin: 10px 0 0; }
.warn { font-size: 13.5px; color: var(--rouge); margin-top: 6px; }

</style>
</head>
<body>
<main id="view"></main>
<nav id="tabbar" class="tabbar hide" aria-label="Navigation principale"><div class="in">
  <button data-act="tab" data-tab="accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7v8.5a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-act="tab" data-tab="depenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.5h6M9 12.5h6"/></svg>Dépenses</button>
  <button data-act="tab" data-tab="bourse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5v17M16 3.5v17"/><rect x="5.5" y="8" width="5" height="7" rx="1"/><rect x="13.5" y="6" width="5" height="9" rx="1"/></svg>Bourse</button>
  <button data-act="tab" data-tab="patrimoine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5 12 4.5l8.5 5"/><path d="M5.5 10.5v7M10 10.5v7M14 10.5v7M18.5 10.5v7M3.5 20h17"/></svg>Patrimoine</button>
  <button data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5v15h16"/><path d="M7.5 15l3.5-4 3 2.5 5-6"/></svg>Plan</button>
  <button data-act="tab" data-tab="plus"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>Plus</button>
</div></nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
/* ===================== MOTEUR DE CALCUL ===================== */
const POCHES = ['garanti', 'actions', 'av', 'crypto', 'provisions', 'attente'];
const CATS = ['logement', 'energie', 'alimentation', 'transport', 'necessaires', 'loisirs', 'divers'];
const COMPTES = [
  { k: 'livretA', l: 'Livret A', p: 'garanti' },
  { k: 'lep', l: 'LEP', p: 'garanti' },
  { k: 'ldds', l: 'LDDS', p: 'garanti' },
  { k: 'livretJeune', l: 'Livret Jeune', p: 'garanti' },
  { k: 'pea', l: 'PEA', p: 'actions' },
  { k: 'cto', l: 'Compte-titres', p: 'actions' },
  { k: 'crypto', l: 'Crypto, toutes plateformes', p: 'crypto' },
  { k: 'trEspeces', l: 'TR Espèces : provisions', p: 'provisions' },
  { k: 'trAttente', l: 'TR Espèces : à investir', p: 'attente' },
  { k: 'av', l: 'Assurance-vie', p: 'av' },
  { k: 'courant', l: 'Comptes courants', p: 'courant' },
];
const POCHE_LABEL = {
  garanti: 'Livrets', actions: 'PEA et actions', av: 'Assurance-vie', crypto: 'Crypto',
  provisions: 'Provisions', attente: 'À investir', courant: 'Comptes courants', sortie: 'Dépense',
};
const CAT_LABEL_DEFAUT = {
  logement: 'Logement (loyer et charges)',
  energie: 'Énergie, internet, assurance',
  alimentation: 'Alimentation hors carte restaurant',
  transport: 'Transport',
  necessaires: 'Nécessaires (mutuelle, abonnements, téléphone)',
  loisirs: 'Loisirs et sorties',
  divers: 'Divers',
  salaire: 'Salaire net reçu',
  caf: 'CAF',
  autresRevenus: 'Autres revenus',
  provisionsDep: 'Payé depuis les provisions',
  projets: 'Projets financés par l’épargne',
};

/* ---------- Dates : clés « AAAA-MM » ---------- */
const M = {
  parse(k) { const [y, m] = String(k).split('-').map(Number); return { y, m }; },
  key(y, m) { return y + '-' + String(m).padStart(2, '0'); },
  add(k, n) { const { y, m } = M.parse(k); const t = y * 12 + (m - 1) + n; return M.key(Math.floor(t / 12), (t % 12 + 12) % 12 + 1); },
  diff(a, b) { const A = M.parse(a), B = M.parse(b); return (B.y * 12 + B.m) - (A.y * 12 + A.m); },
  now() { const d = new Date(); return M.key(d.getFullYear(), d.getMonth() + 1); },
  list(a, b) { const out = []; if (!a || !b) return out; for (let k = a; k <= b && out.length < 1200; k = M.add(k, 1)) out.push(k); return out; },
  month(k) { return M.parse(k).m; },
  year(k) { return M.parse(k).y; },
  qeOnOrBefore(k) { const { y, m } = M.parse(k); const q = Math.floor(m / 3) * 3; return q === 0 ? M.key(y - 1, 12) : M.key(y, q); },
  valid(k) { return /^\d{4}-(0[1-9]|1[0-2])$/.test(String(k)); },
  clamp(k, a, b) { return k < a ? a : (k > b ? b : k); },
};

const sumBy = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
const n0 = (x) => (typeof x === 'number' && isFinite(x) ? x : 0);

/* ---------- Phases ---------- */
function sortPhases(plan) { plan.phases.sort((a, b) => (a.debut < b.debut ? -1 : a.debut > b.debut ? 1 : 0)); }
function phaseFor(plan, k) { let p = plan.phases[0]; for (const ph of plan.phases) if (ph.debut <= k) p = ph; return p; }
function phaseFin(plan, ph) {
  const i = plan.phases.indexOf(ph);
  return i < plan.phases.length - 1 ? M.add(plan.phases[i + 1].debut, -1) : plan.fin;
}
function phaseCalc(ph, k) {
  const idx = Math.max(0, M.diff(ph.debut, k || ph.debut));
  const salaire = n0(ph.revenus.salaire) * Math.pow(1 + n0(ph.hausse), Math.floor(idx / 12));
  const revenus = salaire + n0(ph.revenus.caf) + n0(ph.revenus.autres);
  const dep = sumBy(CATS, (c) => n0(ph.depenses[c]));
  const vprov = n0(ph.provisions.versement);
  const epargne = revenus - dep - vprov;
  return { salaire, revenus, dep, vprov, epargne, taux: revenus > 0 ? epargne / revenus : 0 };
}

/* ---------- Projection mensuelle ---------- */
function project(plan) {
  const b = {}; POCHES.forEach((p) => { b[p] = n0(plan.soldes[p]); });
  const t = plan.taux, P = plan.plafonds, D = plan.dates, R = plan.regles;
  const rows = [];
  for (const k of M.list(plan.debut, plan.fin)) {
    const ph = phaseFor(plan, k); const c = phaseCalc(ph, k);
    const lep = k <= D.finLEP;
    const tg = lep ? n0(t.garantiAvecLEP) : n0(t.garantiSansLEP);
    b.garanti *= Math.pow(1 + tg, 1 / 12);
    b.actions *= Math.pow(1 + n0(t.actions), 1 / 12);
    b.av *= Math.pow(1 + n0(t.av), 1 / 12);
    b.crypto *= Math.pow(1 + n0(t.crypto), 1 / 12);
    b.provisions *= Math.pow(1 + n0(t.provisions), 1 / 12);
    b.attente *= Math.pow(1 + n0(t.attente), 1 / 12);

    const a = ph.alloc;
    if (c.epargne >= 0) {
      b.actions += c.epargne * n0(a.actions); b.garanti += c.epargne * n0(a.garanti);
      b.crypto += c.epargne * n0(a.crypto); b.av += c.epargne * n0(a.av);
    } else b.garanti += c.epargne;
    let vA = c.epargne >= 0 ? c.epargne * n0(a.actions) : 0; let vC = c.epargne >= 0 ? c.epargne * n0(a.crypto) : 0; let evA = 0;

    b.provisions += c.vprov - n0(ph.provisions.depenses);
    if (b.provisions < 0) { b.garanti += b.provisions; b.provisions = 0; }

    const evs = [];
    for (const e of plan.evenements) {
      const nb = Math.max(1, Math.round(n0(e.nbMois) || 1)); const i = M.diff(e.mois, k);
      if (i >= 0 && i < nb) {
        const x = n0(e.montant) / nb;
        if (b[e.de] !== undefined) b[e.de] -= x;
        if (e.vers && e.vers !== 'sortie' && b[e.vers] !== undefined) b[e.vers] += x;
        if (e.vers === 'actions') { vA += x; evA += x; } if (e.de === 'actions') vA -= x;
        if (e.vers === 'crypto') vC += x; if (e.de === 'crypto') vC -= x;
        evs.push({ id: e.id, x });
      }
    }

    const plafond = n0(P.livretA) + n0(P.ldds) + (lep ? n0(P.lep) : 0) + (k <= D.finLivretJeune ? n0(P.livretJeune) : 0);
    let debord = 0;
    if (b.garanti > plafond) { debord = b.garanti - plafond; b.av += debord; b.garanti = plafond; }

    let versAV = 0, reeq = 0;
    if (M.month(k) === 12) {
      if (b.provisions > n0(P.provisions)) { versAV = b.provisions - n0(P.provisions); b.provisions = n0(P.provisions); b.av += versAV; }
      if (R.reequilibrageCrypto) {
        const tot = sumBy(POCHES, (p) => b[p]); const max = n0(R.cryptoMax) * tot;
        if (b.crypto > max) { reeq = b.crypto - max; b.crypto = max; b.actions += reeq; vA += reeq; vC -= reeq; }
      }
    }
    const total = sumBy(POCHES, (p) => b[p]);
    rows.push({
      k, phase: ph.id, ...c, ...b, total,
      risque: total > 0 ? (b.actions + b.crypto) / total : 0,
      cryptoPct: total > 0 ? b.crypto / total : 0,
      plafond, debord, versAV, reeq, evs, vA, vC, evA,
    });
  }
  return rows;
}

function indexRows(rows) { const m = {}; rows.forEach((r) => { m[r.k] = r; }); return m; }
function startTotal(plan) { return sumBy(POCHES, (p) => n0(plan.soldes[p])); }
function planAt(plan, byKey, k) {
  if (k < plan.debut) { const o = { total: startTotal(plan) }; POCHES.forEach((p) => { o[p] = n0(plan.soldes[p]); }); return o; }
  return byKey[k] || null;
}

/* ---------- Relevés réels ---------- */
function releveParPoche(rel) {
  const o = { garanti: 0, actions: 0, av: 0, crypto: 0, provisions: 0, attente: 0, courant: 0 };
  COMPTES.forEach((c) => { o[c.p] += n0(rel.comptes[c.k]); });
  o.total = sumBy(Object.keys(o), (p) => o[p]);
  o.horsCourant = o.total - o.courant;
  return o;
}
function lastReleve(releves) { const ks = Object.keys(releves).sort(); return ks.length ? releves[ks[ks.length - 1]] : null; }

/* ---------- Projets et objectifs ---------- */
function projets(plan, byKey) {
  const g = {};
  for (const e of plan.evenements) {
    if (e.vers !== 'sortie') continue;
    const nom = e.projet || e.libelle || 'Projet';
    const last = M.add(e.mois, Math.max(1, Math.round(n0(e.nbMois) || 1)) - 1);
    const it = g[nom] || (g[nom] = { nom, montant: 0, debut: e.mois, fin: last, ks: [] });
    it.montant += n0(e.montant);
    if (e.mois < it.debut) it.debut = e.mois; if (last > it.fin) it.fin = last;
    for (let i = 0; i < Math.max(1, Math.round(n0(e.nbMois) || 1)); i++) it.ks.push(M.add(e.mois, i));
  }
  return Object.values(g).map((it) => {
    let statut = 'ok';
    for (const k of it.ks) {
      const r = byKey[k]; if (!r) continue;
      if (r.garanti < 0) statut = 'non';
      else if (statut !== 'non' && k >= plan.urgence.avant && r.garanti < n0(plan.urgence.montant)) statut = 'entame';
    }
    return { ...it, statut };
  }).sort((a, b) => (a.debut < b.debut ? -1 : 1));
}
function besoinsGarantis(plan, apres) {
  const futur = sumBy(plan.evenements.filter((e) => e.vers === 'sortie' && e.de === 'garanti'), (e) => {
    const nb = Math.max(1, Math.round(n0(e.nbMois) || 1)); let s = 0;
    for (let i = 0; i < nb; i++) if (M.add(e.mois, i) >= apres) s += n0(e.montant) / nb;
    return s;
  });
  return { urgence: n0(plan.urgence.montant), projets: futur, total: n0(plan.urgence.montant) + futur };
}

/* ---------- Bilan d'un mois de dépenses ---------- */
function bilanMois(plan, k, saisie) {
  const ph = phaseFor(plan, k); const c = phaseCalc(ph, k);
  const rev = n0(saisie.salaire) + n0(saisie.caf) + n0(saisie.autresRevenus);
  const dep = sumBy(CATS, (x) => n0(saisie[x]));
  const epargne = rev - dep - c.vprov;
  const cats = CATS.map((x) => ({ k: x, reel: n0(saisie[x]), prevu: n0(ph.depenses[x]) }));
  return {
    ph, c, rev, dep, epargne, prevu: c.epargne, ecart: epargne - c.epargne,
    taux: rev > 0 ? epargne / rev : 0, cats,
    provisionsDep: n0(saisie.provisionsDep), provisionsPrevu: n0(ph.provisions.depenses), projets: n0(saisie.projets),
  };
}


/* ---------- Bourse : ordres prévus, versements réels, performance ---------- */
function lignesPlan(plan) { return (plan.bourse && plan.bourse.lignes) || []; }
function boursePrevu(plan, byKey, k) {
  const r = byKey[k]; if (!r) return null;
  const act = plan.evenements.filter((e) => e.vers === 'actions').map((e) => ({ e, i: M.diff(e.mois, k), nb: Math.max(1, Math.round(n0(e.nbMois) || 1)) })).filter((x) => x.i >= 0 && x.i < x.nb);
  const lignes = {}; let dirSp = 0, dirEm = 0, surLignes = 0;
  act.forEach((x) => {
    const v = n0(x.e.montant) / x.nb; const l = x.e.ligne || '';
    if (l === 'sp500') { dirSp += v; surLignes += v; } else if (l === 'em') { dirEm += v; surLignes += v; }
    else if (l) { lignes[l] = (lignes[l] || 0) + v; surLignes += v; }
  });
  const base = r.vA - surLignes;
  return {
    actions: r.vA, crypto: r.vC, sp500: base * n0(plan.pea.sp500) + dirSp, em: base * n0(plan.pea.emergents) + dirEm, lignes, btc: r.vC,
    reeq: r.reeq, evenements: r.evA, attente: r.attente, epargne: r.epargne,
    etapes: act.map((x) => ({ libelle: x.e.projet || x.e.libelle, n: x.i + 1, sur: x.nb, montant: n0(x.e.montant) / x.nb, ligne: x.e.ligne || '' })),
  };
}
function bourseGroupes(d) {
  const lg = Object.keys(d).filter((x) => x.indexOf('l_') === 0).reduce((t, x) => t + n0(d[x]), 0);
  return { actions: n0(d.sp500) + n0(d.em) + lg - n0(d.ctoVente), crypto: n0(d.btc) - n0(d.btcVente) };
}
function perfAt(plan, bourse, rel) {
  const start = M.add(plan.debut, -1); if (!rel || rel.k <= start) return null;
  const ms = M.list(plan.debut, rel.k); const N = ms.length;
  const V0a = n0(plan.soldes.actions), V0c = n0(plan.soldes.crypto);
  const ga = Math.pow(1 + n0(plan.taux.actions), 1 / 12), gc = Math.pow(1 + n0(plan.taux.crypto), 1 / 12);
  let Ha = V0a, Hc = V0c, Ca = 0, Cc = 0, Wa = 0, Wc = 0, manquants = 0;
  ms.forEach((m, j) => {
    const d = bourse[m]; if (!d) manquants++;
    const g = d ? bourseGroupes(d) : { actions: 0, crypto: 0 };
    Ha = Ha * ga + g.actions * Math.sqrt(ga); Hc = Hc * gc + g.crypto * Math.sqrt(gc);
    const w = (N - j - 0.5) / N; Ca += g.actions; Cc += g.crypto; Wa += g.actions * w; Wc += g.crypto * w;
  });
  const pr = releveParPoche(rel);
  const dietz = (V, V0, C, W) => (V0 + W > 0 ? (V - V0 - C) / (V0 + W) : 0);
  const ann = (R) => (1 + R > 0 ? Math.pow(1 + R, 12 / N) - 1 : -1);
  const grp = (V, V0, C, W, H) => { const r = dietz(V, V0, C, W), rh = dietz(H, V0, C, W); return { valeur: V, investi: V0 + C, verse: C, pv: V - V0 - C, hyp: H, ecart: V - H, r, rh, ra: ann(r), rha: ann(rh) }; };
  const av = plan.bourse && plan.bourse.investiAvant ? plan.bourse.investiAvant : {};
  const A = grp(pr.actions, V0a, Ca, Wa, Ha), Cr = grp(pr.crypto, V0c, Cc, Wc, Hc), T = grp(pr.actions + pr.crypto, V0a + V0c, Ca + Cc, Wa + Wc, Ha + Hc);
  if (n0(av.actions) > 0) A.pvTotale = pr.actions - n0(av.actions) - Ca;
  if (n0(av.crypto) > 0) Cr.pvTotale = pr.crypto - n0(av.crypto) - Cc;
  if (A.pvTotale !== undefined && Cr.pvTotale !== undefined) T.pvTotale = A.pvTotale + Cr.pvTotale;
  const lignes = lignesPlan(plan).map((l) => {
    let C = 0, H = 0; ms.forEach((m) => { const d = bourse[m]; const c = d ? n0(d['l_' + l.id]) : 0; H = H * ga + c * Math.sqrt(ga); C += c; });
    const V = n0(rel.comptes['l_' + l.id]);
    return { id: l.id, nom: l.nom, valeur: V, investi: C, pv: V - C, hyp: H, ecart: V - H, renseigne: V > 0 };
  }).filter((x) => x.investi > 0 || x.valeur > 0);
  return { k: rel.k, N, manquants, actions: A, crypto: Cr, total: T, lignes };
}

/* ---------- Alertes : les conseils intégrés ---------- */
function alertes(ctx) {
  const { plan, rows, byKey, releves, depenses, today, fmt } = ctx;
  const { eur, pct, mois, moisLong, finMois } = fmt;
  const deMois = fmt.deMois || ((k) => 'de ' + moisLong(k));
  const out = [];
  const R = plan.regles;

  plan.phases.forEach((ph) => {
    if (phaseFin(plan, ph) < today) return;
    const c = phaseCalc(ph, ph.debut);
    if (c.epargne < 0) {
      out.push({ n: 'rouge', t: `Budget intenable : ${ph.nom}`, x: `Ce budget laisse un déficit de ${eur(-c.epargne)} par mois, pris sur tes livrets. Réduis une dépense ou revois le logement.`, go: { tab: 'plan', view: 'budget', id: ph.id } });
    } else if (c.revenus > 0 && c.taux < 0.15) {
      out.push({ n: 'orange', t: `Taux d’épargne faible : ${ph.nom}`, x: `${pct(c.taux)} de tes revenus. Repère : 15 % minimum, 20 % et plus si possible.`, go: { tab: 'plan', view: 'budget', id: ph.id } });
    }
    const loy = n0(ph.depenses.logement);
    if (loy > 0 && c.salaire > 0 && loy / c.salaire > 1 / 3 + 0.001) {
      out.push({ n: 'orange', t: `Loyer à ${pct(loy / c.salaire, 0)} du salaire : ${ph.nom}`, x: `Repère : 33 % maximum, c’est aussi la règle des 3× des bailleurs (revenu de ${eur(3 * loy)}). Prévois la garantie Visale ou un garant, ou vise ${eur(c.salaire / 3)} de loyer maximum.`, go: { tab: 'plan', view: 'budget', id: ph.id } });
    }
  });

  const phLog = plan.phases.find((ph) => n0(ph.depenses.logement) > 0);
  if (phLog) {
    const c = phaseCalc(phLog, phLog.debut);
    const need = n0(R.urgenceMois) * (c.dep + c.vprov);
    if (n0(plan.urgence.montant) < need * 0.95) {
      out.push({ n: 'orange', t: 'Fonds d’urgence sous-dimensionné', x: `${R.urgenceMois} mois de charges en « ${phLog.nom} » représentent ${eur(need)}. Ta cible est de ${eur(plan.urgence.montant)}.`, go: { tab: 'plus', view: 'reglages' } });
    }
  }
  const ru = byKey[plan.urgence.avant];
  if (ru && ru.garanti < n0(plan.urgence.montant)) {
    out.push({ n: 'rouge', t: 'Fonds d’urgence pas atteint à temps', x: `La projection donne ${eur(ru.garanti)} sur les livrets en ${mois(plan.urgence.avant)}, pour une cible de ${eur(plan.urgence.montant)}.` });
  }
  const neg = rows.find((r) => r.garanti < -1);
  if (neg) {
    out.push({ n: 'rouge', t: 'Livrets à découvert', x: `La projection passe sous zéro en ${mois(neg.k)}. Un projet n’est pas financé : réduis-le, décale-le ou augmente la part garantie de ton épargne.`, go: { tab: 'plan', view: 'evenements' } });
  }
  projets(plan, byKey).forEach((g) => {
    if (g.statut === 'entame') out.push({ n: 'orange', t: `${g.nom} entame le fonds d’urgence`, x: `Après ce projet, les livrets passent sous ${eur(plan.urgence.montant)}. Augmente la part garantie avant ${mois(g.debut)}.` });
  });
  if (!R.reequilibrageCrypto) {
    const rc = rows.find((r) => r.cryptoPct > n0(R.cryptoMax) + 0.001);
    if (rc) out.push({ n: 'orange', t: 'Crypto au-dessus du plafond dans la projection', x: `Elle dépasse ${pct(R.cryptoMax, 0)} du patrimoine en ${mois(rc.k)}. Active le rééquilibrage de décembre ou baisse sa part.` });
  }

  const rel = lastReleve(releves);
  if (rel) {
    const pr = releveParPoche(rel);
    if (pr.total > 0 && pr.crypto / pr.total > n0(R.cryptoMax) + 0.001) {
      out.push({ n: 'orange', t: `Crypto à ${pct(pr.crypto / pr.total)} de ton patrimoine`, x: `Au-dessus de ton plafond de ${pct(R.cryptoMax, 0)}. En décembre, vends l’excédent (${eur(pr.crypto - n0(R.cryptoMax) * pr.total)}) et verse-le sur le PEA.` });
    }
    const pv = planAt(plan, byKey, rel.k);
    if (pv && pv.total > 0) {
      const e = (pr.horsCourant - pv.total) / pv.total;
      if (e < -0.1) out.push({ n: 'orange', t: 'En retard sur ton plan', x: `Au ${finMois(rel.k)}, ton épargne est ${pct(-e, 0)} sous la projection (${eur(pr.horsCourant - pv.total)}). L’onglet Dépenses montre où part l’écart.`, go: { tab: 'depenses' } });
      else if (e > 0.1) out.push({ n: 'vert', t: 'En avance sur ton plan', x: `Au ${finMois(rel.k)}, ton épargne dépasse la projection de ${pct(e, 0)} (${eur(pr.horsCourant - pv.total)}). Garde le cap.` });
    }
  }

  const qe = M.qeOnOrBefore(M.add(today, -1));
  if (qe >= M.add(plan.debut, -1) && qe <= plan.fin && !releves[qe]) {
    out.push({ n: 'info', t: `Relevé du ${finMois(qe)} à saisir`, x: 'Un relevé par trimestre suffit pour suivre ta trajectoire.', go: { tab: 'patrimoine', k: qe } });
  }
  const bourse = ctx.bourse || {};
  const km = M.clamp(today, plan.debut, plan.fin); const rk = byKey[km];
  if (rk && (rk.vA > 0.5 || Math.abs(rk.vC) > 0.5) && !bourse[km]) {
    out.push({ n: 'info', t: `Ordres ${deMois(km)} : ${eur(rk.vA + rk.vC)} à investir`, x: `Dont ${eur(rk.vA)} sur le PEA et ${eur(rk.vC)} en crypto. Le détail ligne par ligne est dans l’onglet Bourse.`, go: { tab: 'bourse', k: km } });
  }
  if (rel && rel.k >= plan.debut) {
    const manq = M.list(plan.debut, rel.k).filter((m) => !bourse[m]).length;
    if (manq > 0) out.push({ n: 'info', t: `Versements en bourse à saisir sur ${manq} mois`, x: 'Sans eux, ta plus-value est surestimée et la comparaison avec tes hypothèses ne tient pas.', go: { tab: 'bourse' } });
  }
  const pm = M.add(today, -1);
  if (pm >= plan.debut && pm <= plan.fin && !depenses[pm]) {
    out.push({ n: 'info', t: `Dépenses ${deMois(pm)} à saisir`, x: 'Cinq minutes : reporte les totaux de ton appli bancaire.', go: { tab: 'depenses', k: pm } });
  }
  if (plan.dates.finNonImposable && today <= plan.dates.finNonImposable) {
    out.push({ n: 'info', t: `Non imposable jusqu’en ${moisLong(plan.dates.finNonImposable)}`, x: 'Fenêtre à exploiter : purge tes plus-values (compte-titres, crypto) à 17,2 % au lieu de 30 %, et coche la case 2OP de ta déclaration.' });
  }

  const ordre = { rouge: 0, orange: 1, info: 2, vert: 3 };
  return out.sort((a, b) => ordre[a.n] - ordre[b.n]);
}

/* ---------- Plan vierge ---------- */
function planVierge(debut) {

const Q = {};
function queued(id, fn) { const run = () => fn(); const p = (Q[id] || Promise.resolve()).then(run, run); Q[id] = p.catch(() => {}); return p; }
const LS_KEY = 'mon-patrimoine-v1';
const Store = {
  async init() {
    const c = window.claude;
    if (c && typeof c.use === 'function') {
      try {
        const [db, user, dl] = await Promise.all([c.use('db'), c.use('user'), c.use('downloads')]);
        S.dl = dl || null;
        if (db && user) { const uid = await user.id(); if (uid) { S.db = db; S.uid = uid; S.mode = 'db'; return; } }
      } catch (e) { console.warn('Capacités indisponibles', e); }
    }
    S.mode = 'local';
  },
  col() { return S.db.collection('data/users/' + S.uid); },
  async loadAll() {
    const res = { plan: null, checklist: { done: {} }, releves: {}, depenses: {}, bourse: {} };
    if (S.mode === 'db') {
      const snap = await Store.col().get();
      for (const d of snap.docs) {
        const v = clone(d.data() || {});
        if (d.id === 'plan') res.plan = v;
        else if (d.id === 'checklist') res.checklist = v;
        else if (d.id.indexOf('releve-') === 0) res.releves[d.id.slice(7)] = v;
        else if (d.id.indexOf('depenses-') === 0) res.depenses[d.id.slice(9)] = v;
        else if (d.id.indexOf('bourse-') === 0) res.bourse[d.id.slice(7)] = v;
      }
      return res;
    }
    try { const raw = localStorage.getItem(LS_KEY); if (raw) return Object.assign(res, JSON.parse(raw)); } catch (e) { /* stockage vide ou bloqué */ }
    return res;
  },
  writeLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ plan: S.plan, checklist: S.checklist, releves: S.releves, depenses: S.depenses, bourse: S.bourse })); }
    catch (e) { throw new Error('Stockage de l’appareil indisponible'); }
  },
  put(id, data) { if (S.mode !== 'db') { Store.writeLocal(); return Promise.resolve(); } return queued(id, () => Store.col().doc(id).set(clone(data))); },
  del(id) { if (S.mode !== 'db') { Store.writeLocal(); return Promise.resolve(); } return queued(id, () => Store.col().doc(id).delete()); },
  async replaceAll() {
    if (S.mode !== 'db') { Store.writeLocal(); return; }
    const snap = await Store.col().get();
    const keep = new Set(['plan', 'checklist'].concat(Object.keys(S.releves).map((k) => 'releve-' + k), Object.keys(S.depenses).map((k) => 'depenses-' + k), Object.keys(S.bourse).map((k) => 'bourse-' + k)));
    await Store.put('plan', S.plan); await Store.put('checklist', S.checklist);
    for (const k of Object.keys(S.releves)) await Store.put('releve-' + k, S.releves[k]);
    for (const k of Object.keys(S.depenses)) await Store.put('depenses-' + k, S.depenses[k]);
    for (const k of Object.keys(S.bourse)) await Store.put('bourse-' + k, S.bourse[k]);
    for (const doc of snap.docs) if (!keep.has(doc.id)) await Store.del(doc.id);
  },
};

function normalize(p) {
  p.phases = p.phases || []; p.evenements = p.evenements || []; p.jalons = p.jalons || []; p.libelles = p.libelles || {};
  p.pea = p.pea || { sp500: 0.85, emergents: 0.15 }; p.dates = p.dates || {};
  p.regles = p.regles || { cryptoMax: 0.05, reequilibrageCrypto: true, urgenceMois: 4 };
  p.urgence = p.urgence || { montant: 0, avant: p.debut };
  p.bourse = p.bourse || { investiAvant: { actions: 0, crypto: 0 } }; p.bourse.investiAvant = p.bourse.investiAvant || { actions: 0, crypto: 0 };
  p.plafonds = p.plafonds || { livretA: 22950, ldds: 12000, lep: 10000, livretJeune: 1600, provisions: 2500 };
  sortPhases(p);
}
function recompute() { S.rows = project(S.plan); S.byKey = indexRows(S.rows); }

async function boot() {
  render();
  await Store.init();
  try {
    const d = await Store.loadAll();
    S.plan = d.plan; S.checklist = d.checklist && d.checklist.done ? d.checklist : { done: {} };

}

/* ===================== ACCUEIL ===================== */
function frise(p, tk) {
  const start = p.debut; const lastStart = p.phases[p.phases.length - 1].debut;
  let end = M.add(lastStart, 18); if (end > p.fin) end = p.fin;
  const span = Math.max(1, M.diff(start, end) + 1); const W = 1000;
  const x = (k) => (M.diff(start, k) / span) * W;
  let defs = '', segs = '';
  p.phases.forEach((ph, i) => {
    const finK = phaseFin(p, ph); if (ph.debut > end) return;
    const a = x(ph.debut); const b = Math.min(W, x(M.add(finK, 1)));
    const cur = tk >= ph.debut && tk <= finK; const past = finK < tk;
    const col = cur ? 'var(--accent)' : past ? 'var(--ink-3)' : 'var(--accent-soft)';
    const last = i === p.phases.length - 1;
    if (last) defs += `<linearGradient id="fg"><stop offset="0.55" style="stop-color:${col};stop-opacity:1"/><stop offset="1" style="stop-color:${col};stop-opacity:0"/></linearGradient>`;
    segs += `<rect x="${(a + 2).toFixed(1)}" y="34" width="${Math.max(3, b - a - 4).toFixed(1)}" height="24" rx="6" style="fill:${last ? 'url(#fg)' : col}"><title>${esc(ph.nom)}</title></rect>`;
  });
  let ticks = '';
  for (let y = M.year(start) + 1; y <= M.year(end); y++) {
    const k = M.key(y, 1); if (k > end) break; const xx = x(k);
    ticks += `<line x1="${xx.toFixed(1)}" x2="${xx.toFixed(1)}" y1="62" y2="70" style="stroke:var(--ink-3)" stroke-width="2"/><text x="${xx.toFixed(1)}" y="98" text-anchor="middle" font-size="28" style="fill:var(--ink-3)">${y}</text>`;
  }
  const mk = M.clamp(tk, start, end); const mx = x(mk) + (W / span) / 2;
  const marker = `<path d="M${(mx - 10).toFixed(1)},4 L${(mx + 10).toFixed(1)},4 L${mx.toFixed(1)},20 Z" style="fill:var(--ink)"/><line x1="${mx.toFixed(1)}" x2="${mx.toFixed(1)}" y1="18" y2="62" style="stroke:var(--ink)" stroke-width="3"/>`;
  return `<svg viewBox="0 0 ${W} 104" role="img" aria-label="Frise des phases de vie"><defs>${defs}</defs>${segs}${ticks}${marker}</svg>`;
}

function alertsHTML(list) {

}

        <div class="prog"><span style="width:${Math.min(100, bes.total ? livReels / bes.total * 100 : 100).toFixed(1)}%"></span></div>

/* ===================== DÉPENSES DU MOIS ===================== */
function defDepMois() { const p = S.plan; return M.clamp(M.add(today(), -1) >= p.debut ? M.add(today(), -1) : p.debut, p.debut, p.fin); }

  const visibles = CATS.filter((x) => UI.depAll || n0(ph.depenses[x]) > 0 || (saved && n0(saved[x]) > 0));
  const caches = CATS.length - visibles.length;

  let bilan = '';
  if (saved) {
    const b = bilanMois(p, k, saved);
    bilan = `<h2>Bilan du mois</h2>
      <div class="summary">
        <div><b class="${b.ecart >= 0 ? 'up' : 'down'}">${eur(b.epargne)}</b><span>Épargne réelle, prévu ${eur(b.prevu)}</span></div>

      </div>
      <div class="group" style="margin-top:12px">${b.cats.filter((x) => x.prevu > 0 || x.reel > 0).map((x) => {
        const over = x.reel > x.prevu * 1.1 && x.reel - x.prevu > 20; const w = x.prevu > 0 ? Math.min(100, x.reel / x.prevu * 100) : 100;
        return `<div class="cmp"><div class="top"><span>${esc(lbl(x.k))}</span><span class="r ${over ? 'down' : ''}">${eur(x.reel)} sur ${eur(x.prevu)}</span></div><div class="track"><span class="${over ? 'over' : ''}" style="width:${w.toFixed(1)}%"></span></div></div>`;
      }).join('')}

  }

  const hist = Object.keys(S.depenses).sort().reverse().slice(0, 12).map((m) => {

    return `<div class="row tap" data-act="depGo" data-k="${m}"><div class="l">${mois(m)}<div class="tiny">${pct(b.taux, 0)} d’épargne</div></div><div class="r"><div>${eur(b.epargne)}</div><div class="tiny ${b.ecart >= 0 ? 'up' : 'down'}">${eurS(b.ecart)}</div></div></div>`;

    ${bilan}
    ${hist ? `<h2>Mois enregistrés</h2><div class="group">${hist}</div>` : ''}

}

/* ===================== RELEVÉ TRIMESTRIEL ===================== */
function relBornes() { const p = S.plan; return { a: M.qeOnOrBefore(M.add(p.debut, -1)), b: M.qeOnOrBefore(p.fin) }; }
function defRelMois() { const { a, b } = relBornes(); return M.clamp(M.qeOnOrBefore(M.add(today(), -1)), a, b); }

function scrPatrimoine() {
  const p = S.plan; const k = UI.relMois || defRelMois(); UI.relMois = k; const { a, b } = relBornes();
  const saved = S.releves[k];
  const prevK = Object.keys(S.releves).filter((x) => x < k).sort().pop(); const prev = prevK ? S.releves[prevK] : null;
  const fields = COMPTES.map((c) => {
    const v = saved ? n0(saved.comptes[c.k]) : (prev ? n0(prev.comptes[c.k]) : 0);
    const pk = S.byKey[k] || planAt(p, S.byKey, k);
    const h = c.k === 'trAttente' ? `Selon le plan : ${eur(pk ? pk.attente : 0)}. Part de ton solde TR destinée au PEA.` : c.k === 'trEspeces' ? 'Solde TR Espèces moins la somme à investir.' : (prev ? `Relevé précédent : ${eur(prev.comptes[c.k])}` : '');
    const main = fNum(c.k, c.l, v, { pre: !saved, hint: h });
    if (c.k !== 'pea') return main;
    return main + lignesPlan(p).map((l) => { const kk = 'l_' + l.id; const v2 = saved ? n0(saved.comptes[kk]) : (prev ? n0(prev.comptes[kk]) : 0); return fNum(kk, `dont ${l.nom}`, v2, { pre: !saved, hint: 'Valeur de ta ligne à cette date, déjà incluse dans le PEA : elle ne s’ajoute pas au total.' }); }).join('');
  }).join('');

  let bilan = '';
  if (saved) {
    const pr = releveParPoche(saved); const pv = planAt(p, S.byKey, k);
    const e = pv ? pr.horsCourant - pv.total : 0;
    bilan = `<h2>Comparaison avec le plan</h2>
      <div class="summary"><div><b>${eur(pr.total)}</b><span>Patrimoine total</span></div><div><b class="${e >= 0 ? 'up' : 'down'}">${eurS(e)}</b><span>Écart avec le plan, hors comptes courants${pv && pv.total ? ` (${pct(e / pv.total)})` : ''}</span></div></div>
      <div class="group" style="margin-top:12px">${POCHES.map((x) => `<div class="row"><div class="l">${pocheDot(x)} ${esc(POCHE_LABEL[x])}</div><div class="r">${eur(pr[x])}<div class="tiny">plan ${pv ? eur(pv[x]) : '—'}</div></div></div>`).join('')}
      <div class="row"><div class="l">${pocheDot('courant')} Comptes courants</div><div class="r">${eur(pr.courant)}<div class="tiny">hors plan</div></div></div></div>`;
  }

  const ks = Object.keys(S.releves).sort().reverse();
  const hist = ks.map((x) => {
    const pr = releveParPoche(S.releves[x]); const pv = planAt(p, S.byKey, x); const e = pv && pv.total ? (pr.horsCourant - pv.total) / pv.total : 0;
    return `<tr${x === k ? ' class="sel"' : ''}><td>${finMois(x)}</td><td>${eur(pr.horsCourant)}</td><td>${pv ? eur(pv.total) : '—'}</td><td class="${e >= 0 ? 'up' : 'down'}">${pct(e)}</td></tr>`;
  }).join('');

  return `<div class="screen">
    ${head('Patrimoine')}
    <div class="stepper"><button class="prev" data-act="relStep" data-d="-3" aria-label="Trimestre précédent"${k <= a ? ' disabled' : ''}></button><div class="cur"><b>${finMois(k)}</b><span>${saved ? 'Relevé enregistré' : 'Relevé à saisir'}</span></div><button class="next" data-act="relStep" data-d="3" aria-label="Trimestre suivant"${k >= b ? ' disabled' : ''}></button></div>
    ${saved && saved.note ? `<p class="note">${esc(saved.note)}</p>` : ''}
    ${!saved ? `<p class="note">${prev ? 'Soldes du relevé précédent pré-remplis' : 'Saisis le solde de chaque compte'} : mets à jour chaque ligne avec le solde réel à cette date.</p>` : ''}
    <div id="form-rel"><div class="group">${fields}</div></div>
    <div class="btns"><button class="btn" data-act="saveRel">Enregistrer le relevé</button>${saved ? '<button class="btn danger" data-act="delRel">Effacer ce relevé</button>' : ''}</div>
    ${bilan}
    ${hist ? `<h2>Historique</h2><div class="scroll-x"><table class="tbl"><thead><tr><th>Date</th><th>Épargne réelle</th><th>Plan</th><th>Écart</th></tr></thead><tbody>${hist}</tbody></table></div><p class="tiny" style="margin-top:8px">Épargne réelle = patrimoine hors comptes courants, comparée à la projection au même mois.</p>` : ''}
  </div>`;
}

/* ===================== BOURSE ===================== */
function defBourseMois() { const p = S.plan; return M.clamp(today(), p.debut, p.fin); }

function ordreRow(label, v, sub) {
  const neg = v < -0.5;
  return `<div class="row"><div class="l">${esc(label)}${sub ? `<div class="tiny">${sub}</div>` : ''}</div><div class="r ${neg ? 'down' : ''}">${neg ? 'Vendre ' + eur(-v) : eur(v)}</div></div>`;
}

function scrBourse() {
  const p = S.plan; const k = UI.bourseMois || defBourseMois(); UI.bourseMois = k;
  const pv = boursePrevu(p, S.byKey, k); if (!pv) return `<div class="screen">${head('Bourse')}<p class="calm">Aucune projection pour ce mois.</p></div>`;

  const ph = phaseFor(p, k); const saved = S.bourse[k]; const pre = !saved;
  const reeq = Math.round(Math.max(0, pv.reeq));

  const rp = { sp500: Math.round(pv.sp500), em: Math.round(pv.em), btc: Math.max(0, Math.round(pv.btc + pv.reeq)), btcVente: reeq };

  rp.actions = rp.sp500 + rp.em + LG.reduce((t, l) => t + rp['l_' + l.id], 0); rp.crypto = rp.btc - rp.btcVente; rp.total = rp.actions + rp.crypto;

  let change = '';
  if (pvPrev) {

    change = d.length
      ? `<p class="note">À modifier dans tes plans d’épargne Trade Republic par rapport à ${moisLong(prevK)} : ${d.map((x) => `${x[0]} ${eurS(x[1])}`).join(', ')}.</p>`
      : '<p class="note">Mêmes montants que le mois dernier : rien à changer dans tes plans d’épargne.</p>';
  } else change = '<p class="note">Premier mois du plan : programme ces montants dans tes plans d’épargne Trade Republic.</p>';

  /* Versements réalisés */
  const lastRel = lastReleve(S.releves);

  const val = (x) => (saved ? n0(saved[x]) : rp[x]);
  let cmp = '';
  if (saved) {
    const g = bourseGroupes(saved); const tr = g.actions + g.crypto, tp = rp.total;
    cmp = `<div class="summary"><div><b class="${tr >= tp - 0.5 ? 'up' : 'down'}">${eur(tr)}</b><span>Investi ce mois, prévu ${eur(tp)}</span></div><div><b>${eurS(tr - tp)}</b><span>Écart avec le plan</span></div></div>
      <div class="group" style="margin-top:12px">

  const ms = M.list(p.debut, k); let cumP = 0, cumR = 0, nS = 0;
  ms.forEach((m) => { const x = boursePrevu(p, S.byKey, m); if (x) cumP += rpOf(x).total; const d = S.bourse[m]; if (d) { const g = bourseGroupes(d); cumR += g.actions + g.crypto; nS++; } });
  const hist = Object.keys(S.bourse).sort().reverse().slice(0, 12).map((m) => {
    const g = bourseGroupes(S.bourse[m]); const x = boursePrevu(p, S.byKey, m); const tp = x ? rpOf(x).total : 0; const tr = g.actions + g.crypto;

    const tbl = rels.map((x) => { const f = perfAt(p, S.bourse, S.releves[x]); const t = f.total; return `<tr><td>${finMois(x)}</td><td>${eur(t.valeur)}</td><td>${eur(t.hyp)}</td><td class="${t.ecart >= 0 ? 'up' : 'down'}">${eurS(t.ecart)}</td><td>${pct(f.N >= 12 ? t.ra : t.r)}</td></tr>`; }).join('');
    perf = `<p class="muted small" style="margin-top:-4px">Au ${finMois(pf.k)}, d’après ton relevé.</p>
      <div class="summary"><div><b>${eur(pf.total.valeur)}</b><span>Valeur de tes placements en bourse</span></div><div><b class="${pf.total.ecart >= 0 ? 'up' : 'down'}">${eurS(pf.total.ecart)}</b><span>Écart avec tes hypothèses (${eur(pf.total.hyp)})</span></div></div>
      <div class="group" style="margin-top:12px">${bloc('PEA et compte-titres', pf.actions)}${bloc('Crypto', pf.crypto)}${bloc('Total', pf.total)}</div>
      ${pf.lignes.length ? `<h2>Tes lignes individuelles</h2><div class="group">${pf.lignes.map((l) => `<div class="goal"><div class="top"><h3>${esc(l.nom)}</h3><span class="r">${l.renseigne ? eur(l.valeur) : '—'}</span></div><div class="tiny">${l.renseigne ? `Investi ${eur(l.investi)}, plus-value <span class="${l.pv >= 0 ? 'up' : 'down'}">${eurS(l.pv)}</span>. Le même argent au rendement supposé de tes actions (${pct(p.taux.actions)} par an) vaudrait ${eur(l.hyp)} : écart <span class="${l.ecart >= 0 ? 'up' : 'down'}">${eurS(l.ecart)}</span>.` : `Renseigne la ligne « dont ${esc(l.nom)} » de ton relevé trimestriel pour suivre sa performance.`}</div></div>`).join('')}</div>` : ''}
      ${pf.manquants ? `<p class="warn">${pf.manquants} mois sans versements saisis entre ${mois(p.debut)} et ${mois(pf.k)} : la plus-value est surestimée d’autant.</p>` : ''}
      ${rels.length > 1 ? `<h2>Relevé après relevé</h2><div class="scroll-x"><table class="tbl"><thead><tr><th>Date</th><th>Valeur</th><th>Hypothèse</th><th>Écart</th><th>Rendement</th></tr></thead><tbody>${tbl}</tbody></table></div>` : ''}
      <p class="note">Sur quelques mois, l’écart avec l’hypothèse ne dit rien : un ETF actions peut perdre 20 % une année et en gagner 25 la suivante. Juge ta stratégie sur 5 ans et plus, pas sur un trimestre.</p>`;
  }

  return `<div class="screen">
    ${head('Bourse')}
    <div class="stepper"><button class="prev" data-act="bourseStep" data-d="-1" aria-label="Mois précédent"${k <= p.debut ? ' disabled' : ''}></button><div class="cur"><b>${moisLong(k)}</b><span>${esc(ph.nom)}</span></div><button class="next" data-act="bourseStep" data-d="1" aria-label="Mois suivant"${k >= p.fin ? ' disabled' : ''}></button></div>

      ${ordreRow('Bitcoin', rp.btc)}

      ${fNum('em', 'Pays émergents, PEA', val('em'), { pre, hint: `Prévu : ${eur(rp.em)}` })}
      ${LG.map((l) => fNum('l_' + l.id, `${l.nom}, PEA`, val('l_' + l.id), { pre, hint: `Prévu : ${eur(rp['l_' + l.id])}. Montant réellement payé, frais compris.` })).join('')}
      ${fNum('btc', 'Bitcoin acheté', val('btc'), { pre, hint: `Prévu : ${eur(rp.btc)}` })}
      ${showBtcV ? fNum('btcVente', 'Bitcoin vendu', val('btcVente'), { pre, hint: 'Vente réinvestie sur le PEA, par exemple au rééquilibrage de décembre.' }) : ''}
      ${showCto ? fNum('ctoVente', 'Compte-titres vendu', saved ? n0(saved.ctoVente) : 0, { pre, hint: 'Montant de la vente, réinvesti sur les lignes PEA ci-dessus.' }) : ''}

    ${hist ? `<div class="group" style="margin-top:12px">${hist}</div>` : ''}

    <h2>Performance</h2>

  </div>`;
}

/* ===================== PLAN ===================== */
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, x)))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

function chartSVG(p, rows, selK) {
  const W = 1000, H = 540, L = 96, Rm = 18, T = 18, B = 64; const n = rows.length; if (!n) return '';
  const realPts = Object.keys(S.releves).sort().map((k) => ({ k, v: releveParPoche(S.releves[k]).horsCourant }));
  const maxV = Math.max(1, ...rows.map((r) => r.total), ...realPts.map((x) => x.v)) * 1.05;
  const step = niceStep(maxV / 4); const top = Math.ceil(maxV / step) * step;
  const X = (i) => L + (Math.max(0, Math.min(n - 1, i)) / Math.max(1, n - 1)) * (W - L - Rm);
  const Y = (v) => T + (1 - v / top) * (H - T - B);
  const idx = (k) => M.diff(p.debut, k);
  let grid = '';
  for (let v = 0; v <= top + 0.5; v += step) { const y = Y(v).toFixed(1); grid += `<line x1="${L}" x2="${W - Rm}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-width="1.5"/><text x="${L - 12}" y="${(+y + 9).toFixed(1)}" text-anchor="end" font-size="26" style="fill:var(--ink-3)">${kEur(v)}</text>`; }
  let acc = rows.map(() => 0); let areas = '';
  POCHES.forEach((po) => {
    const lower = acc.slice(); acc = acc.map((a, i) => a + Math.max(0, rows[i][po]));
    const up = acc.map((a, i) => `${X(i).toFixed(1)},${Y(a).toFixed(1)}`).join(' ');
    const lo = lower.map((a, i) => `${X(i).toFixed(1)},${Y(a).toFixed(1)}`).reverse().join(' ');
    areas += `<polygon points="${up} ${lo}" style="fill:var(--c-${po});opacity:.92"/>`;
  });
  let xt = ''; const y0 = M.year(p.debut), y1 = M.year(p.fin); const every = y1 - y0 > 6 ? 2 : 1;
  for (let y = y0 + 1; y <= y1; y++) { if ((y - y0) % every) continue; const i = idx(M.key(y, 1)); if (i < 0 || i >= n) continue; xt += `<text x="${X(i).toFixed(1)}" y="${H - 22}" text-anchor="middle" font-size="26" style="fill:var(--ink-3)">${y}</text>`; }
  let real = ''; const rp = realPts.filter((x) => idx(x.k) >= -1 && idx(x.k) < n);
  if (rp.length > 1) real += `<polyline points="${rp.map((x) => `${X(idx(x.k)).toFixed(1)},${Y(x.v).toFixed(1)}`).join(' ')}" fill="none" style="stroke:var(--ink)" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"/>`;
  real += rp.map((x) => `<circle cx="${X(idx(x.k)).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="9" style="fill:var(--surface);stroke:var(--ink)" stroke-width="4"/>`).join('');
  const sx = X(idx(selK)).toFixed(1);
  const sel = `<line x1="${sx}" x2="${sx}" y1="${T}" y2="${H - B}" style="stroke:var(--ink)" stroke-width="2.5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projection du patrimoine, touche pour choisir un mois" data-act="chart" data-l="${L}" data-r="${Rm}" data-n="${n}">${grid}${areas}${real}${sel}${xt}</svg>`;
}

/* ---------- Écouteurs ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') e.preventDefault();
  Promise.resolve(f(el, e)).catch((err) => { console.error(err); toast('Une erreur est survenue : ' + (err.message || err)); });
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.jalon) {
    const id = t.dataset.jalon;
    if (t.checked) S.checklist.done[id] = new Date().toISOString().slice(0, 10); else delete S.checklist.done[id];
    const box = t.closest('.jalon'); if (box) box.classList.toggle('done', t.checked);
    await save('checklist', S.checklist, t.checked ? 'Étape cochée' : 'Étape décochée');
  }
  if (t.dataset && t.dataset.restore && t.files && t.files[0]) { const f = t.files[0]; t.value = ''; await restoreFrom(f); }
});
document.addEventListener('input', (e) => { if (e.target.closest && e.target.closest('#form-phase')) updatePhaseSummary(); });
document.addEventListener('focusin', (e) => { const t = e.target; if (t.classList && t.classList.contains('prefilled')) t.classList.remove('prefilled'); });

boot();

</script>
